stages: 
  - test
  - deploy
############
before_script:
  - export DETECT_ENV_CHANGE=$(git diff --name-only HEAD HEAD~1)
  - echo $DETECT_ENV_CHANGE
  - export DEPLOY_ENV=$(echo $DETECT_ENV_CHANGE | cut -d'/' -f2)
  - echo "$ORG - $DEPLOY_ENV";

include:
  - project: 'ci/common-ci'
    file: 'haproxy-ci/deploy-vars.gitlab-ci.yml'
  - project: 'ci/common-ci'
    file: 'haproxy-ci/new-haproxy-rules.gitlab-ci.yml'
  #- project: 'ci/common-ci'
  #  file: 'haproxy-ci/before-script.gitlab-ci.yml'
############

test:
  stage: test
  script:
    - echo "Compile and testing haproxy cfg for $DEPLOY_ENV ..."
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - docker build --build-arg ENV="$DEPLOY_ENV" -f dockerfiles/Dockerfile -t haproxy-check-config .
    - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
          docker image rm -f haproxy-check-config;
      else
          echo "Fatal errors found in configuration.";
      fi;
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never

deploy:  
  stage: deploy
  script:
      - if [ "$ORG" == "Nexcel" ];
        then
          if echo $DEPLOY_ENV | grep -q "local"; then export ANSIBLE_JOB=480;
          elif echo $DEPLOY_ENV | grep -q "uat"; then export ANSIBLE_JOB=494;
          elif echo $DEPLOY_ENV | grep -q "sit"; then export ANSIBLE_JOB=606;
          elif echo $DEPLOY_ENV | grep -q "prod"; then export ANSIBLE_JOB=528;
          elif echo $DEPLOY_ENV | grep -q "prod-nex3"; then export ANSIBLE_JOB=496;
          elif echo $DEPLOY_ENV | grep -q "aws"; then export ANSIBLE_JOB=693;
          elif echo $DEPLOY_ENV | grep -q "aws-nex3"; then export ANSIBLE_JOB=651;
          fi;
        elif [ "$ORG" == "Lumi" ];
        then
          if echo $DEPLOY_ENV | grep -q "local"; then export ANSIBLE_JOB=474;
          elif echo $DEPLOY_ENV | grep -q "uat"; then export ANSIBLE_JOB=472;
          elif echo $DEPLOY_ENV | grep -q "sit"; then export ANSIBLE_JOB=472;
          elif echo $DEPLOY_ENV | grep -q "prod"; then export ANSIBLE_JOB=473;
          elif echo $DEPLOY_ENV | grep -q "aws"; then export ANSIBLE_JOB=650;
          fi;
        fi;
      - echo $ANSIBLE_JOB;
      - if curl --fail -k -s --user $ansible_user:$ansible_pass -X POST "https://ansible.nexdev.net/api/v2/job_templates/$ANSIBLE_JOB/launch/"; then
          echo "$ORG - Deploying application to $DEPLOY_ENV ...";
        fi;
      - sleep 60
      - echo "$ORG - Done Deployment to $DEPLOY_ENV !";
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always