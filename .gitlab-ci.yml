variables:
  DOCKERFILE_ENV: "local_test"

stages: 
  - test
  - deploy

############
include:
  - project: 'ci/common-ci'
    file: 'haproxy-ci/deploy-vars.gitlab-ci.yml'
  #- project: 'ci/common-ci'
  #  file: 'haproxy-ci/deploy-rules.gitlab-ci.yml'

############

test:
  stage: test
  script:
    - echo "Compile and testing haproxy cfg ..."
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - MY_KEY=${SSH_PRIVATE_KEY_1}\n${SSH_PRIVATE_KEY_2}\n${SSH_PRIVATE_KEY_3}
    - docker build --build-arg SSH_KEY="$MY_KEY" -f dockerfiles/Dockerfile_$DOCKERFILE_ENV -t haproxy-check-config .
    - docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg
    - docker image rm -f haproxy-check-config

deploy:  
  stage: deploy 
  script:
    - echo "Deployed!"