stages: 
  - test
  - deploy
############
include:
  - project: 'ci/common-ci'
    file: 'haproxy-ci/deploy-vars.gitlab-ci.yml'
  - project: 'ci/common-ci'
    file: 'haproxy-ci/new-haproxy-rules.gitlab-ci.yml'
  - project: 'ci/common-ci'
    file: 'haproxy-ci/before-script.gitlab-ci.yml'
############

test:
  stage: test
  script:
    - echo $ANSIBLE_JOB;
    - echo "Compile and testing haproxy cfg for $DEPLOY_ENV ..."
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - docker build --build-arg ENV="$DEPLOY_ENV" -f dockerfiles/Dockerfile -t haproxy-check-config .
    - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
          docker image rm -f haproxy-check-config;
      else
          echo "Fatal errors found in configuration.";
      fi;

deploy:  
  stage: deploy
  variables:
    MANUAL_DEPLOY_ENV: "sit"
  script:
      - echo "Deploying application to $DEPLOY_ENV ...";
  rules:
    - if: $DEPLOY_ENV == $MANUAL_DEPLOY_ENV
      when: manual
    - when: always