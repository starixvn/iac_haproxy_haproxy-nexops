frontend alpha_state_redis_docker_fe
    bind *:16379 name alpha_state_redis
    mode tcp
    option dontlog-normal
    option tcp-check
    default_backend alpha_state_redis_docker_be
    # default_backend redis_k8s_alpha_state

backend alpha_state_redis_docker_be
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server 10.2.27.15_6311 10.2.27.15:6311 check inter 1s
    server 10.2.27.14_6311 10.2.27.14:6311 check inter 1s
    server 10.2.27.13_6311 10.2.27.13:6311 check inter 1s

backend redis_k8s_alpha_state
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server k8s_redis 10.99.185.214:30383 check inter 3s rise 10 fall 5

