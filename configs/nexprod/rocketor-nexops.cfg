
backend nexops_nexops_skynex_NEXPROD_1_path_be
    balance source
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /hangfire
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/skynex.test[/]?,/)]
    server-template nexops_skynex_NEXPROD_1_ 2 nexops_skynex_NEXPROD_1:5000 check resolvers docker init-addr none

