    option httplog
    option http-keep-alive
    option forwardfor
    option httpchk GET /whoami.aspx
    http-check expect status 200
    server 10.18.200.123_7803 10.18.200.123:7803 check
    server 10.18.200.122_7803 10.18.200.122:7803 check

backend nexops_ndict_api_be
