backend nexops_nuget_be
    mode http
    option httplog
    option forwardfor
    #option http-keep-alive
    #option httpchk HEAD /whoami.aspx
    #http-check expect status 200
    #server 10.18.200.122_http_7805 10.18.200.122:7805 check
