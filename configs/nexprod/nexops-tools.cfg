backend nexops_nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 3 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_portainer_portainer_be
    option forwardfor
    option http-server-close
    cookie serverid insert
    option dontlog-normal
    server-template portainer 1 portainer_portainer:9000 check resolvers docker init-addr none

backend nexops_awx_web_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 400
    cookie serverid insert
    server 10.18.200.131_http_8089 10.18.200.131:8089 check
    #server-template ansible_awx_ 1 awx_web:8052 check resolvers docker init-addr none

backend nexops_bot_skynex_be
    mode http
    balance source
    option httplog
    option forwardfor
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    server 10.18.200.122_http_6969 10.18.200.122:6969 check
    server 10.18.200.123_http_6969 10.18.200.123:6969 check

backend nexops_rocketor_be
    mode http
    log global
    option httplog
    option http-keep-alive
    option forwardfor
    cookie serverid insert
    balance source
    timeout client 30m
    timeout server 30m
    timeout check 30s
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    server 10.18.200.122_http_9999 10.18.200.122:9999 check
    server 10.18.200.123_http_9999 10.18.200.123:9999 check

backend nexops_rocketor_api_be
    mode http
    option httplog
    option forwardfor
    option httpchk GET /
    http-check expect status 200
    server 10.18.200.122_http_7801 10.18.200.122:7801 check
    server 10.18.200.123_http_7801 10.18.200.123:7801 check

backend nexops_rocketor_proxy_be
    mode http
    option httplog
    option forwardfor
    option httpchk GET /
    http-check expect status 200
    server 10.18.200.122_http_7802 10.18.200.122:7802 check
    server 10.18.200.123_http_7802 10.18.200.123:7802 check

frontend nexops_gosql_api_fe
    bind *:8801
    mode http
    use_backend nexops_gosql_api_be

backend nexops_gosql_api_be
    mode http
    option httplog
    option forwardfor
    option httpchk HEAD /
    http-check expect status 200
    server-template nexops_gosql_api_ 2 nexops_gosql_api_NEXPROD:80 check resolvers docker init-addr none

backend nexops_gosql_proxy_be
    mode http
    option httplog
    option forwardfor
    option httpchk HEAD /
    http-check expect status 200
    server 10.18.200.122_http_8802 10.18.200.122:8802 check
    server 10.18.200.123_http_8802 10.18.200.123:8802 check

