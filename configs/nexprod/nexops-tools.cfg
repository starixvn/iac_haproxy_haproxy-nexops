frontend nexops_rocketor_state_service_fe
    bind *:42424
    mode tcp
    option tcp-check
    option tcplog
    use_backend nexops_rocketor_state_service_be

backend nexops_rocketor_state_service_be
    mode tcp
    option tcplog
    option tcp-check
    default-server inter 3s fall 3 rise 10
    server 10.18.200.122_tcp_42424 10.18.200.122:42424 check
    server 10.18.200.123_tcp_42424 10.18.200.123:42424 check backup
