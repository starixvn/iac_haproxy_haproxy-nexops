frontend nexops_sentry_web_prod_fe
    bind *:9009
    mode  http
    option forwardfor
    default_backend nexops_sentry_web_prod_be

backend nexops_sentry_web_prod_be
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template sentry_web_prod_ 2 sentry_web_prod:9000 check resolvers docker init-addr none

backend alpha_log_be
    option forwardfor
    option http-server-close
    option httpchk GET /login?nextUrl=%2F
    http-check expect status 200
    cookie serverid insert
    server 10.99.99.100_http_5605 10.99.99.100:5605 check

backend default_backend_nodes
    http-request return status 503 content-type "text/plain"  lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake."
