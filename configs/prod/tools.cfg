frontend nexops_sentry_fe
    bind *:9009
    mode  http
    option forwardfor
    default_backend sentry_web_prod_nodes

backend sentry_web_prod_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template sentry_web_prod_ 2 sentry_web_prod:9000 check resolvers docker init-addr none

backend alpha_log_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /login?nextUrl=%2F
    http-check expect status 200
    cookie serverid insert
    server 10.99.99.100_http_5605 10.99.99.100:5605 check


backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Empty backend! Pls contact NexOps if you think this is a mistake.."
