

backend nexops_nexops_skynex_data_api_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template nexops_skynex_data_api_PROD_ 2 nexops_skynex_data_api_PROD:5000 check resolvers docker init-addr none

backend nexops_sample_website1_cloned8_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/,/,i)]
    server-template sample_website1_cloned8_PROD_ 1 sample_website1_cloned8_PROD:5000 check resolvers docker init-addr none
