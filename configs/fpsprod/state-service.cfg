frontend nap_session_state_fe
    bind *:42424
    option tcplog
    mode tcp
    default_backend nap_asp_state_be

frontend alpha_session_state_fe
    bind *:42428
    option tcplog
    mode tcp
    default_backend alpha_asp_state_be
###
backend nap_asp_state_be
    mode tcp
    balance source
    option tcplog
    option tcp-check
    default-server inter 2s fall 5 rise 5
    server state_40_11_42424 10.40.40.11:42424 check
    server state_99_70_42424 10.99.99.70:42424 check
    server state_99_166_42424 10.99.99.166:42424 backup

backend alpha_asp_state_be
    mode tcp
    balance source
    option tcplog
    option tcp-check
    default-server inter 2s fall 5 rise 5
    server state_27_11_42424 10.2.27.11:42424 check
    server state_27_111_42424 10.2.27.111:42424 check
    server state_27_112_42424 10.2.27.112:42424 check
    server state_99_70_42424 10.99.99.70:42424 check backup
