    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server 10.2.23.21_6312 10.2.23.21:6312 check inter 1s
    server 10.2.23.22_6312 10.2.23.22:6312 check inter 1s
    server 10.2.23.23_6312 10.2.23.23:6312 check inter 1s

##### FPS PROD
backend redis_k8s_fps
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server k8s_redis 10.99.185.214:16381 check inter 3s rise 10 fall 5
