backend pentagon_l2_fantan_service_UAT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/uat/fantan[/]?,/)]
    server-template l2_fantan_service_UAT_ 1 l2_fantan_service_UAT:5000 check resolvers docker init-addr none

