frontend fe_redis_1710
bind *:1710 
mode tcp
option tcp-check
option tcplog
#default_backend redis_6323_nodes
default_backend backend_redis

#####
backend backend_redis
mode tcp
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.70.70.31_6311 10.70.70.31:6311 check inter 1s
server 10.70.70.32_6311 10.70.70.32:6311 check inter 1s
server 10.70.70.33_6311 10.70.70.33:6311 check inter 1s
