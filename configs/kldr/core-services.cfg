########### NexOps
frontend RabbitMQ_fe
    bind *:5672
    mode tcp
    option tcplog
    option tcp-check
    default_backend RabbitMQ_be

frontend RabbitMQ_Admin_fe
    bind *:15672
    mode tcp
    option tcplog
    option tcp-check
    default_backend RabbitMQ_Admin_be

backend RabbitMQ_be
    mode tcp
    maxconn 10000
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template rabbitmq_node_ 2 rabbitmq_rabbit:5672 check resolvers docker init-addr none

backend RabbitMQ_Admin_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template rabbitmq_admin_node_ 2 rabbitmq_rabbit:15672 check resolvers docker init-addr none

