frontend nap_session_state_fe
    bind *:42424
    option tcplog
    mode tcp
    default_backend nap_asp_state_be

frontend alpha_session_state_fe
    bind *:42428
    option tcplog
    mode tcp
    default_backend alpha_asp_state_be
####
backend nap_asp_state_be
    mode tcp
    option tcplog
    option tcp-check
    default-server inter 2s fall 5 rise 5
    server state_54_42424 10.143.8.54:42424 check
    server state_55_42424 10.143.8.55:42424 check backup

backend alpha_asp_state_be
    mode tcp
    option tcplog
    option tcp-check
    default-server inter 2s fall 5 rise 5
    server state_55_42424 10.143.8.55:42424 check
    server state_54_42424 10.143.8.54:42424 check backup
