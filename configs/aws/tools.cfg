backend nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 2 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_wsdeployment_api_be
    option forwardfor
    timeout client 10m
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server nexops_wsdeployment_115.11 10.110.115.11:8086 check
