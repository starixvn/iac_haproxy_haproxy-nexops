#######################
### REDIS for NAP
frontend frontend_nap_redis
bind *:63799 name nap_redis
mode tcp
default_backend backend_nap_redis
option tcplog
option tcp-check

backend backend_nap_redis
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.2.27.27_6311 10.2.27.27:6311 check inter 1s
server 10.2.27.25_6311 10.2.27.25:6311 check inter 1s
server 10.2.27.28_6311 10.2.27.28:6311 check inter 1s

