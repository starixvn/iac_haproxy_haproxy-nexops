frontend frontend_nap_redis_single
bind *:16379
mode tcp
default_backend backend_nap_redis_single
option tcplog
option tcp-check

backend backend_nap_redis_single
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.110.115.12_16179 10.110.115.12:16179 check inter 1s
server 10.110.115.13_16179 10.110.115.13:16179 check inter 1s backup

frontend frontend_alpha_redis_single
bind *:16389
mode tcp
default_backend backend_alpha_redis_single
option tcplog
option tcp-check

backend backend_alpha_redis_single
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.110.115.12_16189 10.110.115.12:16189 check inter 1s
server 10.110.115.13_16189 10.110.115.13:16189 check inter 1s backup
