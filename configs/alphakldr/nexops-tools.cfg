backend nexops_sample_web_app_framework_ALPHAPROD_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template sample_web_app_framework_ALPHAPROD_ 2 sample_web_app_framework_ALPHAPROD:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none

backend prometheus_alpha_be
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template prometheus-stack_prometheus_ 1 prometheus-stack_prometheus:9090 check resolvers docker init-addr none

backend nexops_nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 2 nexops_deployment_api:22222 check resolvers docker init-addr none

