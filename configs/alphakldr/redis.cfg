frontend alpha_state_redis_docker_fe
    bind *:16379 name alpha_state_redis
    mode tcp
    option dontlog-normal
    option tcp-check
    default_backend alpha_state_redis_docker_be

backend alpha_state_redis_docker_be
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server 10.148.8.50_6311 10.148.8.50:6311 check inter 1s
    server 10.148.8.51_6311 10.148.8.51:6311 check inter 1s
    server 10.148.8.52_6311 10.148.8.52:6311 check inter 1s
######### ALPHA prod
frontend alpha_redis_docker_fe
    bind *:16389 name alpha_redis
    mode tcp
    option tcplog
    option tcp-check
    default_backend alpha_redis_docker_be

backend alpha_redis_docker_be
