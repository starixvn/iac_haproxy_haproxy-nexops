### DCS_API
frontend rome_DCS_API_fe
bind *:7200
mode tcp
option tcplog
option tcp-check
default_backend rome_DCS_API_be

backend rome_DCS_API_be
mode tcp

server 172.16.4.65_tcp_7200 172.16.4.65:7200 check 
server 172.16.4.66_tcp_7200 172.16.4.66:7200 check

