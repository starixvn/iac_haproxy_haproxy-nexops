### REDIS for NAP
frontend frontend_nap_redis
bind *:16379 name nap_redis
mode tcp
default_backend backend_nap_redis

option tcplog
option tcp-check

backend backend_nap_redis
mode tcp
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 172.16.2.38_6311 172.16.2.38:6311 check inter 1s
server 172.16.2.39_6311 172.16.2.39:6311 check inter 1s
server 172.16.2.109_6311 172.16.2.109:6311 check inter 1s
######
