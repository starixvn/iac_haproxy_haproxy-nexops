######## REDIS for NAP ####
frontend frontend_nap_redis
    bind *:16379 name nap_redis
    mode tcp
    option tcplog
    option tcp-check
    default_backend backend_nap_redis

backend backend_nap_redis
    mode tcp
    option tcplog
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server 172.16.4.68_6311 172.16.4.68:6311 check inter 1s
    server 172.16.4.69_6311 172.16.4.69:6311 check inter 1s
    server 172.16.4.70_6311 172.16.4.70:6311 check inter 1s
########
