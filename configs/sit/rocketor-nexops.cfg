    option httpchk GET /
    http-check expect status 200
    server-template sample_website1_cloned1_SIT_2_ 1 sample_website1_cloned1_SIT_2:5000 check resolvers docker init-addr none

backend nexops_sample_website1_SIT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,regsub(^/sit[/]?,/,i)]
    server-template sample_website1_SIT_ 1 sample_website1_SIT:5000 check resolvers docker init-addr none

