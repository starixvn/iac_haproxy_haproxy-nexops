

backend nexops_sample_website1_cloned1_SIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template sample_website1_cloned1_SIT_ 1 sample_website1_cloned1_SIT:5000 check resolvers docker init-addr none

backend nexops_sample_website1_cloned1_SIT_2_be
    option forwardfor
