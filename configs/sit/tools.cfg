frontend vault_ui_fe
    bind *:8200
    mode http
    use_backend vault_ui_be

backend vault_ui_be
    option forwardfor
    option http-server-close
    option forwardfor if-none
    cookie serverid insert
    server-template vault_vault_service_ 1 vault_vault_service:8200 check resolvers docker init-addr none 

frontend nexops_deployment_api_fe
    bind *:22222
    mode http
    option forwardfor
    use_backend nexops_deployment_api_be

backend nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 4 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_sentry_web_sit_be
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sentry 1 172.16.2.39:9003 check resolvers docker init-addr none

backend prometheus_be
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template prometheus-stack_prometheus_ 1 prometheus-stack_prometheus:9090 check resolvers docker init-addr none
