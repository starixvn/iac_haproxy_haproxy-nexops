frontend nexops_deployment_api_fe
    bind *:22222
    mode http
    option forwardfor
    use_backend nexops_deployment_api_be

backend nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 4 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_sentry_web_sit_be
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sentry 1 172.16.2.39:9003 check resolvers docker init-addr none

backend nexops_elk_kibana_sit_be
    timeout server 3m
    server-template nexops_elk_kibana 1 elk-stack_kibana:5601 check resolvers docker init-addr none
