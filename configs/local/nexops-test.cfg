frontend testing_be_local
    bind *:8443 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt no-sslv3
    option http-server-close
    option forwardfor
    http-request add-header X-Forwarded-Proto https
    http-request add-header X-Forwarded-Port 8443
default_backend testing_be_local

backend testing_be_local
    #mode http
    server test_be_local 10.70.70.81:443 ssl verify none
