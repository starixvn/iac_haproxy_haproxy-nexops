frontend dennis_testing_fe_local
    bind *:6344 #ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode tcp
    acl tcp_6344 dst_port 6344

    use_backend dennis_testing_be_local if tcp_6344

backend dennis_testing_be_local
    #option forwardfor
    #option http-server-close
    #option httpchk HEAD /
    #http-check expect status 200
    #mode tcp
    server test_be_local 10.70.70.81:8443
