frontend dennis_testing_fe_local
    bind *:6344 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode  tcp
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }

    default_backend dennis_testing_be_local

backend dennis_testing_be_local
    #option forwardfor
    #option http-server-close
    #option httpchk HEAD /
    #http-check expect status 200
    #mode tcp
    server test_be_local 10.70.70.81:8443 ssl verify none
