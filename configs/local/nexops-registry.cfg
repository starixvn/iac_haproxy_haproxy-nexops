frontend nexops_harbor_fe
    bind *:5055 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
default_backend nexops_harbor_be_local

backend nexops_harbor_be
    mode http
    option http-keep-alive
    #http-check expect status 200
    #option httpchk GET /license
    server nexops_harbor_be_8080 10.70.70.32:8080 #check

backend nexops_harbor_be_local
    mode http
    option http-keep-alive
    option httpchk GET /api/v2.0/health HTTP/1.1\r\nHost:\ nexops_harbor_be_local\r\n
    http-check expect status 200
    server nexops_harbor_be_local 10.18.200.157:5055 check
    server nexops_harbor2_be_local 10.18.200.129:5055 check backup

backend nexops_harbor2_be_local
    mode http
    option http-keep-alive
    option httpchk GET /api/v2.0/health HTTP/1.1\r\nHost:\ nexops_harbor2_be_local\r\n
    http-check expect status 200
    server nexops_harbor2_be_local 10.18.200.129:5055 check
