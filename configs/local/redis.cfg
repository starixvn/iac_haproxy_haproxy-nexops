frontend fe_redis_6341
bind *:6341 
mode tcp
option tcp-check
option tcplog
default_backend redis_6321_nodes

backend redis_6321_nodes
mode tcp
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG

server 10.18.200.222_tcp_6321 10.18.200.222:6321 check inter 5s
server 10.18.200.111_tcp_6321 10.18.200.111:6321 check backup inter 5s
