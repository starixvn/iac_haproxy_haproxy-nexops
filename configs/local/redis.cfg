########
frontend fe_redis_6343
bind *:6343 
mode tcp
option tcp-check
option tcplog
#default_backend redis_6323_nodes
default_backend redis_test

backend redis_test
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.18.200.121_6311 10.18.200.121:6311 check inter 1s
server 10.18.200.109_6311 10.18.200.109:6311 check inter 1s
server 10.18.200.144_6311 10.18.200.144:6311 check inter 1s

backend redis_6323_nodes
mode tcp
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
server 10.18.200.222_tcp_6323 10.18.200.222:6323 check inter 3s rise 10 fall 5
server 10.18.200.111_tcp_6323 10.18.200.111:6323  check backup inter 3s rise 10 fall 5
