########
frontend nap_redis_docker_fe2
bind *:1710 name nap_redis2
mode tcp
option tcplog
option tcp-check
default_backend nap_redis_docker_be

frontend nap_redis_docker_fe
bind *:16379 name nap_redis
mode tcp
option tcplog
option tcp-check
default_backend nap_redis_docker_be

backend nap_redis_docker_be
mode tcp
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.18.200.222_6311 10.18.200.222:6311 check inter 1s
server 10.18.200.109_6311 10.18.200.109:6311 check inter 1s
server 10.18.200.144_6311 10.18.200.144:6311 check inter 1s

