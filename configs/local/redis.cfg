#########
backend redis_6323_nodes
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server 10.18.200.184_tcp_6323 10.18.200.184:6323 check inter 3s rise 10 fall 5
    server 10.18.200.222_tcp_6323 10.18.200.222:6323  check backup inter 3s rise 10 fall 5

backend redis_k8s_nap
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server k8s_redis 10.18.200.193:30379 check inter 3s rise 10 fall 5
