
backend nexops_sample_website1_LOCAL_3_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    mode http
    server-template sample_website1_LOCAL_3_ 2 sample_website1_LOCAL_3:5000 check resolvers docker init-addr none

backend nexops_sample_website1_LOCAL_3_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/website1[/]?,/)]
    server-template sample_website1_LOCAL_3_ 2 sample_website1_LOCAL_3:5000 check resolvers docker init-addr none
