backend nexops_sample_website1_LOCAL_be
    option httpchk HEAD /
    http-check expect status 200
    server-template sample_website1_LOCAL_ 2 sample_website1_LOCAL:5000 check resolvers docker init-addr none

backend nexops_sample_static_LOCAL_be
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me STATIC service"

backend nexops_sample_api_LOCAL_be
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me API service"

backend nexops_sample_main_LOCAL_be
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me MAIN service"

