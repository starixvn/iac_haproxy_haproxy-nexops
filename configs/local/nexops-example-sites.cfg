backend nexops_path_sample_website1_LOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/local[/]?,/)]
    server-template sample_website1_LOCAL_ 1 sample_website1_LOCAL:5000 check resolvers docker init-addr none

backend nexops_sample_nodejs_website1_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    server-template sample_nodejs_website1_LOCAL_ 2 sample_nodejs_website1_LOCAL:5000 check resolvers docker init-addr none

backend nexops_nginx_testing_be
    mode http
    option http-keep-alive
    #http-check expect status 200
    #option httpchk GET /license
    server nexops_nginx_testing 10.70.70.32:8000 #check
