
backend nexops_sample_nodejs_website1_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    server-template sample_nodejs_website1_LOCAL_ 2 sample_nodejs_website1_LOCAL:5000 check resolvers docker init-addr none

backend nexops_website_demo1_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    server-template sample_website1_LOCAL_ 2 sample_website1_LOCAL:5000 check resolvers docker init-addr none

backend be_static
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_static"

backend be_api
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_api"
