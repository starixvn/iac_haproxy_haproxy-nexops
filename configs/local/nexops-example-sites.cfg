
backend nexops_sample_nodejs_website1_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    server-template sample_nodejs_website1_LOCAL_ 2 sample_nodejs_website1_LOCAL:5000 check resolvers docker init-addr none

backend nexops_sample_website1_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    server-template sample_website1_LOCAL_ 2 sample_website1_LOCAL:5000 check resolvers docker init-addr none

backend nexops_sample_static_LOCAL_be
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me sample static"

backend nexops_sample_api_LOCAL_be
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me sample api"
