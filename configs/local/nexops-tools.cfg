frontend nexops_rabbitmq_rabbit_fe
    bind *:5672
    mode tcp
    option tcp-check
    option tcplog
    use_backend nexops_rabbitmq_rabbit_be

backend nexops_rabbitmq_rabbit_be
    mode tcp
    maxconn 10000
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template rabbitmq_node_ 2 rabbitmq_rabbit:5672 check resolvers docker init-addr none

