backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Empty backend! Pls contact NexOps if you think this is a mistake." #if { path_beg /whoami }

frontend nexops_rabbitmq_frontend
    bind *:5672
    mode tcp
    option tcp-check
    option tcplog
    use_backend nexops_rabbitmq_nodes

backend nexops_rabbitmq_nodes
    mode tcp
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template rabbitmq_node_ 2 rabbitmq_rabbit:5672 check resolvers docker init-addr none

