#
backend nexops_minio_api_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template minio_api1 1 nexops_minio1:9000 check init-addr none resolvers docker
    server-template minio_api2 1 nexops_minio2:9000 check init-addr none resolvers docker
    server-template minio_api3 1 nexops_minio3:9000 check init-addr none resolvers docker

backend nexops_minio_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template minio1 1 nexops_minio1:9001 check init-addr none resolvers docker
    server-template minio2 1 nexops_minio2:9001 check init-addr none resolvers docker
    server-template minio3 1 nexops_minio3:9001 check init-addr none resolvers docker

backend nexops_nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 4 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_nexops_deployment_api_test_be
    option forwardfor
