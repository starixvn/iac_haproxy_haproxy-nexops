frontend nexops_rabbitmq_rocketor_fe
    bind *:5679
    mode tcp
    option tcp-check
    option tcplog
    use_backend nexops_rabbitmq_rocketor_be

backend nexops_rabbitmq_rocketor_be
    mode tcp
    option tcplog
    option tcp-check
    server 10.18.200.122_tcp_5672 10.18.200.122:5672 check
    server 10.18.200.123_tcp_5672 10.18.200.123:5672 check backup

backend nexops_bot_skynex_be
    mode http
    balance source
    option httplog
    option forwardfor
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    server 10.18.200.122_http_6969 10.18.200.122:6969 check
    server 10.18.200.123_http_6969 10.18.200.123:6969 check

backend nexops_bot_skynex_api_be
    mode http
    option httplog
    option forwardfor
    server 10.18.200.122_http_6868 10.18.200.122:6868 check
    server 10.18.200.123_http_6868 10.18.200.123:6868 check

backend nexops_rocketor_be
    mode http
    log global
    option http-keep-alive
    balance source
    timeout client 30m
    timeout server 30m
    timeout check 30s
    http-check expect status 401
    option httpchk GET /
    server 10.18.200.122_http_9999 10.18.200.122:9999 check
    server 10.18.200.123_http_9999 10.18.200.123:9999 check

