backend nexops_li_deployment_api_be
    option forwardfor
    option http-keep-alive
    timeout http-keep-alive 600s
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 2 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_default_backend_svc_be
    server-template nexops-default-backend-service_nexops-default-backend 2 nexops-default-backend-service_nexops-default-backend:80 check resolvers  docker init-addr none
