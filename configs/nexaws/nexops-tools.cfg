backend nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 3 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_portainer_portainer_be
    option forwardfor
    option http-server-close
    cookie serverid insert
    option dontlog-normal
    server-template portainer 1 portainer_portainer:9000 check resolvers docker init-addr none