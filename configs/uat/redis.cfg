##########
backend redis_k8s_nap
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server k8s_redis 10.99.91.9:16379 check inter 3s rise 10 fall 5

backend redis_k8s_alpha
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send AUTH\ foo1@bared\r\n
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server k8s_redis 10.99.91.9:16389 check inter 3s rise 10 fall 5
