############
frontend nap_redis_docker_fe
bind *:16379 name nap_redis
mode tcp
option tcplog
option tcp-check
default_backend redis_k8s_nap

backend nap_redis_docker_be
mode tcp
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.99.98.115_6311 10.99.98.115:6311 check inter 1s
server 10.99.27.79_6311 10.99.27.79:6311 check inter 1s
server 10.99.98.116_6311 10.99.98.116:6311 check inter 1s

