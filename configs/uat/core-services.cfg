### RabbitMQ
frontend frontend-RabbitMQ
bind *:5672
mode tcp
log global
option tcplog
option tcp-check
default_backend backend-RabbitMQ

backend backend-RabbitMQ
mode tcp
balance source
server 10.2.190.81_tcp_5672 10.2.190.81:5672 check
server 10.2.190.82_tcp_5672 10.2.190.82:5672 check backup

