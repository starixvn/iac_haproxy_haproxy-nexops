### RabbitMQ
frontend RabbitMQ_fe
bind *:5672
mode tcp
option tcplog
option tcp-check
default_backend RabbitMQ_be

backend RabbitMQ_be
mode tcp
server 10.2.190.81_tcp_5672 10.2.190.81:5672 check
server 10.2.190.82_tcp_5672 10.2.190.82:5672 check backup

