
backend nexops_sample_website1_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    server-template sample_website1_UAT_ 1 sample_website1_UAT:5000 check resolvers docker init-addr none

backend nexops_nexops_skynex_data_api_UAT_be
